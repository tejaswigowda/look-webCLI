name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # unit tests, static checks (CSP, bundle scan, message types), then headless Chromium:
      # zero egress, run=export through the editor, error paths, Download, a real edit
      - run: npm test
